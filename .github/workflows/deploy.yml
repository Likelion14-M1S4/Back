name: Deploy

# 컨벤션 §9: main에 머지(push)되면 EC2로 자동 배포. 수동 실행도 가능.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (테스트 제외)
        run: ./gradlew build -x test

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (systemd 유닛 파일 필요)
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Deploy to EC2 (native + systemd)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
        run: |
          set -euo pipefail

          # SSH 키 준비
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem

          # 실행 가능한 jar 선택 (plain.jar 제외) → app.jar
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | head -n 1)
          if [ -z "$jar_file" ]; then echo "jar 파일을 찾지 못했습니다."; exit 1; fi
          cp "$jar_file" app.jar

          SSH="ssh -i key.pem -o StrictHostKeyChecking=no ${EC2_USERNAME}@${EC2_HOST}"
          SCP="scp -i key.pem -o StrictHostKeyChecking=no"

          $SSH "mkdir -p ~/app"

          # .env 생성 (systemd EnvironmentFile - 시크릿만)
          cat > env.deploy <<EOF
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
          KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
          EOF

          # 산출물 전송
          $SCP app.jar "${EC2_USERNAME}@${EC2_HOST}:~/app/app.jar"
          $SCP env.deploy "${EC2_USERNAME}@${EC2_HOST}:~/app/.env"
          $SCP deploy/meisterbear.service "${EC2_USERNAME}@${EC2_HOST}:~/app/meisterbear.service"

          # systemd 유닛 설치 + 재기동
          $SSH "sudo install -m 644 ~/app/meisterbear.service /etc/systemd/system/meisterbear.service \
            && chmod 600 ~/app/.env \
            && sudo systemctl daemon-reload \
            && sudo systemctl enable meisterbear \
            && sudo systemctl restart meisterbear"

          rm -f key.pem app.jar env.deploy
