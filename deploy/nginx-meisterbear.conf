# Nginx 리버스 프록시 (HTTP). server_name을 본인 도메인으로 바꾼 뒤
# certbot --nginx 를 실행하면 이 블록에 HTTPS(443)가 자동 추가된다.
# 배치: /etc/nginx/sites-available/meisterbear → sites-enabled 심볼릭 링크
server {
    listen 80;
    server_name api.example.com;   # ← 가비아 도메인으로 교체 (예: api.silversieon.store)

    client_max_body_size 20M;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
