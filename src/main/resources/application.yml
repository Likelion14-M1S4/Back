server:
  # 리버스 프록시(Nginx) 뒤에서 X-Forwarded-* 헤더를 신뢰 → HTTPS·원본 호스트 인식
  # (없으면 springdoc이 서버 URL을 http로 생성해 Swagger가 mixed content로 차단됨)
  forward-headers-strategy: framework

spring:
  application:
    name: meisterbear
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      # 사진(최대 10MB) 외에 characterId, history(JSON 문자열) 파트와 멀티파트 경계 오버헤드가
      # 같이 실리므로, max-file-size보다 여유 있게 잡아야 함(정확히 같으면 파일만 꽉 채워도 초과될 수 있음)
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET}                     # 평문 커밋 금지 - 환경변수/Secrets로만 주입
  access-token-expiration: 3600000          # 60분 (ms)
  refresh-token-expiration: 1209600000      # 14일 (ms)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}       # 콘솔 클라이언트 시크릿이 활성화(ON)일 때만 주입 - 현재 OFF라 비워둠
  redirect-uri: ${KAKAO_REDIRECT_URI:}         # 백엔드 콜백 주소 (= .../api/auth/kakao/callback)
  # 로그인 완료 후 복귀를 허용할 프론트 origin 목록. state 값을 이 목록으로 검증해 오픈 리다이렉트를 막는다.
  # 첫 항목이 state 유실 시 폴백 기본값이므로 배포 origin을 앞에 둔다 (로컬은 항상 ?redirect=로 명시 전달)
  front-redirect-uris: ${KAKAO_FRONT_REDIRECT_URIS:https://front-ero.pages.dev,http://localhost:5173}

auth:
  # dev 전용 /api/auth/test-token 보호용 공유 시크릿. 미설정이면 해당 엔드포인트는 비활성화(라이브 오노출 방지).
  # 라이브(dev 프로필) 서버에는 반드시 설정하고, 프론트에도 값을 공유해야 Swagger에서 토큰 발급 가능.
  test-token-secret: ${TEST_TOKEN_SECRET:}
  # 개발 편의용 인증 우회 토글. 유저 id를 넣으면 토큰 없는 요청을 그 유저로 자동 인증한다(프론트 연동 기간 한정).
  # 미설정(기본)이면 우회 없음 - 실서비스 전 반드시 비워둘 것.
  optional-user-id: ${AUTH_OPTIONAL_USER_ID:}

openai:
  api-key: ${OPENAI_API_KEY}                # 평문 커밋 금지 - 환경변수/Secrets로만 주입
  model: gpt-5.4-mini

logging:
  level:
    root: INFO
    com.meisterbear: DEBUG
