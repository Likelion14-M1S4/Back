server:
  # 리버스 프록시(Nginx) 뒤에서 X-Forwarded-* 헤더를 신뢰 → HTTPS·원본 호스트 인식
  # (없으면 springdoc이 서버 URL을 http로 생성해 Swagger가 mixed content로 차단됨)
  forward-headers-strategy: framework

spring:
  application:
    name: meisterbear
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}                     # 평문 커밋 금지 - 환경변수/Secrets로만 주입
  access-token-expiration: 3600000          # 60분 (ms)
  refresh-token-expiration: 1209600000      # 14일 (ms)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

logging:
  level:
    root: INFO
    com.meisterbear: DEBUG
