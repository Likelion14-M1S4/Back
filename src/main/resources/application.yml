server:
  forward-headers-strategy: framework

spring:
  application:
    name: meisterbear
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET}                     # 평문 커밋 금지 - 환경변수/Secrets로만 주입
  access-token-expiration: 3600000          # 60분 (ms)
  refresh-token-expiration: 1209600000      # 14일 (ms)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}
  front-redirect-uris: ${KAKAO_FRONT_REDIRECT_URIS:https://front-ero.pages.dev,http://localhost:5173}

auth:
  test-token-secret: ${TEST_TOKEN_SECRET:}
  optional-user-id: ${AUTH_OPTIONAL_USER_ID:}

openai:
  api-key: ${OPENAI_API_KEY}                # 평문 커밋 금지 - 환경변수/Secrets로만 주입
  model: gpt-5.4-mini

logging:
  level:
    root: INFO
    com.meisterbear: DEBUG
