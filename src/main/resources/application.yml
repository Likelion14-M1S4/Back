spring:
  application:
    name: meisterbear
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}                     # 평문 커밋 금지 - 환경변수/Secrets로만 주입
  access-token-expiration: 3600000          # 60분 (ms)
  refresh-token-expiration: 1209600000      # 14일 (ms)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

openai:
  api-key: ${OPENAI_API_KEY}                # 평문 커밋 금지 - 환경변수/Secrets로만 주입
  model: gpt-5.6-luna

logging:
  level:
    root: INFO
    com.meisterbear: DEBUG
